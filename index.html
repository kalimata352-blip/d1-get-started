<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রসেনজিৎ অনলাইন শপ | কর্মী বায়োডাটা ফর্ম</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>প্রসেনজিৎ অনলাইন শপ</h1>
  <p>Data Entry কর্মী বায়োডাটা আবেদন ফর্ম</p>
</header>

<main class="container">
  <div class="notice">
    <b>নির্দেশনা:</b> সঠিক তথ্য দিয়ে ফর্মটি পূরণ করুন। <br>
    <span id="configNote">Google Sheet সংযোগের আগে <code>script.js</code>-এ Apps Script Web App URL বসাতে হবে।</span>
  </div>

  <form id="biodataForm">
    <h2>👤 ব্যক্তিগত তথ্য</h2>
    <div class="grid">
      <label>পূর্ণ নাম *<input name="fullName" required></label>
      <label>বাবার/স্বামীর নাম *<input name="guardianName" required></label>
      <label>জন্মতারিখ *<input type="date" name="dob" required></label>
      <label>লিঙ্গ *<select name="gender" required><option value="">নির্বাচন করুন</option><option>পুরুষ</option><option>মহিলা</option><option>অন্যান্য</option></select></label>
      <label>মোবাইল নম্বর *<input type="tel" name="mobile" inputmode="numeric" pattern="[0-9]{10,11}" maxlength="11" required placeholder="10 বা 11 ডিজিট"></label>
      <label>WhatsApp নম্বর<input type="tel" name="whatsapp" inputmode="numeric" maxlength="11"></label>
      <label>ইমেইল<input type="email" name="email"></label>
      <label>বৈবাহিক অবস্থা<select name="maritalStatus"><option value="">নির্বাচন করুন</option><option>অবিবাহিত</option><option>বিবাহিত</option><option>অন্যান্য</option></select></label>
    </div>

    <h2>🏠 ঠিকানা</h2>
    <div class="grid">
      <label>গ্রাম/শহর *<input name="village" required></label>
      <label>পোস্ট অফিস<input name="postOffice"></label>
      <label>থানা<input name="policeStation"></label>
      <label>জেলা *<input name="district" required></label>
      <label>রাজ্য *<input name="state" value="West Bengal" required></label>
      <label>পিন কোড *<input name="pincode" inputmode="numeric" required></label>
    </div>
    <label>সম্পূর্ণ ঠিকানা *<textarea name="fullAddress" required></textarea></label>

    <h2>🎓 শিক্ষাগত যোগ্যতা</h2>
    <div class="grid">
      <label>সর্বোচ্চ শিক্ষাগত যোগ্যতা *<select name="education" required><option value="">নির্বাচন করুন</option><option>মাধ্যমিক</option><option>উচ্চ মাধ্যমিক</option><option>স্নাতক</option><option>স্নাতকোত্তর</option><option>অন্যান্য</option></select></label>
      <label>কম্পিউটার জানা আছে? *<select name="computer" required><option value="">নির্বাচন করুন</option><option>হ্যাঁ</option><option>না</option></select></label>
      <label>MS Word<select name="msWord"><option>জানি</option><option>জানি না</option><option>সামান্য জানি</option></select></label>
      <label>MS Excel<select name="msExcel"><option>জানি</option><option>জানি না</option><option>সামান্য জানি</option></select></label>
      <label>Typing Speed (প্রতি মিনিটে শব্দ)<input name="typingSpeed" type="number" min="0"></label>
      <label>অভিজ্ঞতা (বছর)<input name="experienceYears" type="number" min="0" step="0.5"></label>
    </div>
    <label>পূর্বের কাজের অভিজ্ঞতা<textarea name="experience"></textarea></label>

    <h2>💼 কাজের তথ্য</h2>
    <div class="grid">
      <label>কোন কাজ করতে চান?<select name="jobType"><option>Data Entry</option><option>Online Work</option><option>Office Work</option><option>অন্যান্য</option></select></label>
      <label>কাজের সময়<select name="availability"><option>Full Time</option><option>Part Time</option><option>Flexible</option></select></label>
    </div>
    <label>নিজের সম্পর্কে কিছু লিখুন<textarea name="about"></textarea></label>

    <label class="check"><input type="checkbox" required> আমি নিশ্চিত করছি যে উপরের তথ্য সঠিক। *</label>
    <button type="submit" id="submitBtn">📤 বায়োডাটা Submit করুন</button>
    <p id="status"></p>
  </form>
</main>

<footer>© 2026 প্রসেনজিৎ অনলাইন শপ</footer>
<script src="script.js"></script>
</body>
</html>
